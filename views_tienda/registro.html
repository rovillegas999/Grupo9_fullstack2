<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Piloto - Audi F1 Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="../index.html">
            AUDI
            <span>F1</span>
            STORE
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuTienda" aria-controls="menuTienda" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuTienda">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="item1.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Noticias F1</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="login-section">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <!-- Tarjeta con Glassmorphism -->
            <div class="card p-4 p-md-5 login-card shadow-lg">
              <div class="text-center mb-4">
                <h3 class="fw-bold text-uppercase">NUEVO PILOTO</h3>
                <p class="text-muted" style="font-size: 0.9rem">Únete al equipo completando tus datos oficiales</p>
              </div>

              <div id="registro-error-msg" class="alert alert-danger d-none" role="alert" style="font-size: 0.85rem"></div>

              <form id="form-registro" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="rut" class="form-label text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px">RUT (Sin puntos ni guión)</label>
                    <input type="text" class="form-control py-2" id="rut" placeholder="Ej: 19011022K" required />
                  </div>

                  <div class="col-md-6">
                    <label for="correo-reg" class="form-label text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px">Correo Electrónico</label>
                    <input type="email" class="form-control py-2" id="correo-reg" placeholder="usuario@duoc.cl" required />
                  </div>

                  <div class="col-md-6">
                    <label for="nombre" class="form-label text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px">Nombre</label>
                    <input type="text" class="form-control py-2" id="nombre" placeholder="Tu nombre" required />
                  </div>

                  <div class="col-md-6">
                    <label for="apellidos" class="form-label text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px">Apellidos</label>
                    <input type="text" class="form-control py-2" id="apellidos" placeholder="Tus apellidos" required />
                  </div>

                  <div class="col-md-6">
                    <label for="password-reg" class="form-label text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px">Contraseña</label>
                    <input type="password" class="form-control py-2" id="password-reg" placeholder="4 a 10 caracteres" required />
                  </div>

                  <div class="col-md-6">
                    <label for="password-conf" class="form-label text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px">Confirmar Contraseña</label>
                    <input type="password" class="form-control py-2" id="password-conf" placeholder="Repite tu contraseña" required />
                  </div>
                </div>

                <div class="mt-4">
                  <button type="submit" class="btn btn-danger w-100 fw-bold py-2">CREAR CUENTA</button>
                </div>
              </form>

              <div class="text-center mt-4">
                <a href="login.html" class="text-white text-decoration-none" style="font-size: 0.9rem">
                  ¿Ya eres parte del equipo?
                  <span class="text-danger fw-bold">Inicia Sesión</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
      <p class="mb-0">© 2026 Audi F1 Store. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
  </body>
</html>
