<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Audi F1 Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="../index.html">
            AUDI
            <span>F1</span>
            STORE
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuTienda" aria-controls="menuTienda" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuTienda">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Noticias F1</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link active" href="login.html">Iniciar Sesión</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="login-section">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <!-- Tarjeta de Login -->
            <div class="card p-4 p-md-5 login-card shadow-lg">
              <div class="text-center mb-4">
                <h3 class="fw-bold text-uppercase">ACCESO DE PILOTO</h3>
                <p class="text-muted fs-sm">Ingresa tus credenciales para continuar</p>
              </div>

              <div id="login-error-msg" class="alert alert-danger d-none fs-xs" role="alert"></div>

              <form id="form-login" novalidate>
                <!--CORREO-->
                <div class="mb-3">
                  <label for="correo" class="form-label text-uppercase form-label-mini">Correo Electrónico</label>
                  <input type="email" class="form-control py-2" id="correo" name="correo" autocomplete="email" list="dominios-correo" placeholder="usuario@duoc.cl" required />
                  <datalist id="dominios-correo">
                    <option value="@duoc.cl"></option>
                    <option value="@profesor.duoc.cl"></option>
                    <option value="@gmail.com"></option>
                  </datalist>
                </div>
                <!--CONTRASEÑA-->
                <div class="mb-4">
                  <label for="password" class="form-label text-uppercase form-label-mini">Contraseña</label>
                  <input type="password" class="form-control py-2" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn btn-danger w-100 fw-bold py-2">INICIAR SESIÓN</button>
              </form>

              <div class="text-center mt-4">
                <a href="registro.html" class="text-white text-decoration-none fs-sm">
                  ¿No tienes cuenta?
                  <span class="text-danger fw-bold">Regístrate</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
      <p class="mb-0">© 2026 Audi F1 Store. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
  </body>
</html>
