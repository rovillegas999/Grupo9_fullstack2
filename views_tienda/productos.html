<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo Oficial - Audi F1 Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/carrito.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="../index.html">
            AUDI
            <span>F1</span>
            STORE
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuTienda" aria-controls="menuTienda" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuTienda">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Noticias F1</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5 min-vh-100">
      <div class="text-center mb-5">
        <h2 class="fw-bold text-uppercase">Catálogo Oficial</h2>
        <p class="text-muted">Viste la ingeniería de Neuburg. Sé parte de la historia 2026.</p>
      </div>

      <!-- Contenedor donde JS inyectará las 12 tarjetas de productos -->
      <div id="contenedor-productos" class="row g-4"></div>
    </main>

    <button
      class="btn btn-danger rounded-circle shadow-lg d-flex justify-content-center align-items-center btn-carrito-flotante"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasCarrito"
      aria-controls="offcanvasCarrito"
    >
      🛒
      <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark fs-xxs">0</span>
    </button>

    <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
      <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title fw-bold text-uppercase" id="offcanvasCarritoLabel">Tu Canasta</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div id="lista-carrito-burbuja" class="flex-grow-1 overflow-auto"></div>
        <div class="mt-auto pt-3 border-top border-secondary">
          <a href="carrito.html" class="btn btn-danger w-100 fw-bold py-3 rounded-0">VER CARRITO COMPLETO</a>
        </div>
      </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
      <p class="mb-0">© 2026 Audi F1 Store. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/carrito.js"></script>
  </body>
</html>
