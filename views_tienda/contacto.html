<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Audi F1 Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="../index.html">
            AUDI
            <span>F1</span>
            STORE
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuTienda" aria-controls="menuTienda" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuTienda">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="item1.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Noticias F1</a></li>
              <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5 min-vh-100">
      <h2 class="fw-bold mb-3 text-center text-uppercase">MESA DE AYUDA</h2>
      <p class="text-center text-muted mb-5">¿Dudas sobre nuestra colección o tu envío? Escríbenos a los pits.</p>

      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card border-0 shadow-sm p-4 bg-white" style="border-top: 4px solid var(--color-secundario) !important">
            <div id="contacto-error-msg" class="alert alert-danger d-none" role="alert" style="font-size: 0.85rem"></div>

            <form id="form-contacto" novalidate>
              <div class="mb-3">
                <label for="nombre-contacto" class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Nombre Completo</label>
                <input type="text" id="nombre-contacto" class="form-control rounded-0 py-2" placeholder="Tu nombre" required />
              </div>

              <div class="mb-3">
                <label for="correo-contacto" class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Correo Electrónico</label>
                <input type="email" id="correo-contacto" class="form-control rounded-0 py-2" placeholder="ejemplo@duoc.cl" required />
              </div>

              <div class="mb-4">
                <label for="comentario-contacto" class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Mensaje</label>
                <textarea id="comentario-contacto" class="form-control rounded-0" rows="5" placeholder="Escribe aquí tus dudas..." required></textarea>
                <div class="form-text" style="font-size: 0.75rem">Máximo 500 caracteres.</div>
              </div>

              <button type="submit" class="btn btn-dark w-100 fw-bold py-2 rounded-0">ENVIAR MENSAJE</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
      <p class="mb-0">© 2026 Audi F1 Store. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
  </body>
</html>
