<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listado de Productos - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="d-flex vh-100">
      <aside
        class="sidebar bg-light border-end d-flex flex-column p-3"
        style="width: 250px"
      >
        <a
          href="home.html"
          class="fs-4 fw-bold text-dark text-decoration-none mb-3"
          >MI TIENDA</a
        >
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="home.html" class="nav-link text-dark">Dashboard</a>
          </li>
          <li>
            <a href="productos_listar.html" class="nav-link active bg-dark"
              >Productos</a
            >
          </li>
          <li>
            <a href="usuarios_listar.html" class="nav-link text-dark"
              >Usuarios</a
            >
          </li>
        </ul>
      </aside>

      <main class="content p-4 w-100 bg-white overflow-auto">
        <div
          class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
        >
          <h1 class="h2 fw-bold">Productos</h1>
          <a href="producto_nuevo.html" class="btn btn-dark rounded-0"
            >NUEVO PRODUCTO</a
          >
        </div>

        <!-- Tabla de datos -->
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Código</th>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>PROD-001</td>
                <td>
                  <img
                    src="https://via.placeholder.com/50"
                    alt="Prod"
                    width="50"
                  />
                </td>
                <td>Camiseta Minimal</td>
                <td>Ropa</td>
                <td>$25.000</td>
                <td>15</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary">Editar</button>
                  <button class="btn btn-sm btn-outline-danger">
                    Eliminar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
