<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantenedor Productos - Audi F1 Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin-body">
    <!-- 
      ARQUITECTURA DE VISTA PRIVADA (DASHBOARD)
      Se implementa Flexbox (d-flex, vh-100) para el layout responsivo.
      Separa lógicamente la navegación (Sidebar) del Mantenedor CRUD.
    -->
    <div class="container-fluid">
      <div class="row">
        <!-- SIDEBAR -->
        <nav class="col-md-3 col-lg-2 d-md-block admin-sidebar sidebar px-0">
          <div class="position-sticky pt-4 d-flex flex-column vh-100">
            <div class="text-center mb-5 px-3">
              <h4 class="text-white fw-bold mb-0">
                AUDI
                <span class="text-danger">F1</span>
              </h4>
              <p class="text-muted" style="font-size: 0.8rem; letter-spacing: 2px">PANEL DE CONTROL</p>
            </div>

            <ul class="nav flex-column mb-auto">
              <li class="nav-item">
                <a class="nav-link text-uppercase py-3" href="admin_home.html">
                  <i class="bi bi-speedometer2 me-2"></i>
                  Resumen Paddock
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active text-uppercase py-3" aria-current="page" href="admin_productos.html">
                  <i class="bi bi-box-seam-fill me-2"></i>
                  Mantenedor Productos
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-uppercase py-3" href="admin_usuarios.html">
                  <i class="bi bi-people-fill me-2"></i>
                  Mantenedor Usuarios
                </a>
              </li>
            </ul>

            <ul class="nav flex-column mt-auto mb-4">
              <li class="nav-item">
                <a class="nav-link text-danger fw-bold text-uppercase py-3" href="../index.html">
                  <i class="bi bi-box-arrow-left me-2"></i>
                  Volver a la Tienda
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 admin-content">
          <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom border-secondary">
            <h1 class="h2 fw-bold text-uppercase">Inventario</h1>
            <button class="btn btn-danger rounded-0 fw-bold">
              <i class="bi bi-plus-lg me-1"></i>
              NUEVO PRODUCTO
            </button>
          </div>

          <!-- FORMULARIO DE PRODUCTO (CRUD) -->
          <div class="card border-0 shadow-sm rounded-0 mb-5">
            <div class="card-header bg-dark text-white rounded-0 py-3">
              <h5 class="mb-0 fw-bold text-uppercase" style="font-size: 0.9rem">
                <i class="bi bi-pencil-square me-2"></i>
                Gestión de Producto
              </h5>
            </div>
            <div class="card-body p-4 bg-white">
              <div id="admin-producto-error" class="alert alert-danger d-none rounded-0 border-0" role="alert"></div>

              <form id="form-admin-producto" novalidate>
                <div class="row g-4">
                  <div class="col-md-6">
                    <label class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Nombre del Producto</label>
                    <input type="text" id="prod-nombre" class="form-control rounded-0" placeholder="Ej: Gorra F1" required />
                  </div>

                  <div class="col-md-3">
                    <label class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Precio ($ CLP)</label>
                    <input type="number" id="prod-precio" class="form-control rounded-0" placeholder="0" min="1" required />
                  </div>

                  <div class="col-md-3">
                    <label class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Descuento (%)</label>
                    <input type="number" id="prod-descuento" class="form-control rounded-0" placeholder="0 a 100" min="0" max="100" />
                  </div>

                  <div class="col-md-12">
                    <label class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Descripción</label>
                    <textarea id="prod-desc" class="form-control rounded-0" rows="3" placeholder="Detalle técnico..."></textarea>
                  </div>

                  <div class="col-md-12">
                    <label class="form-label text-uppercase fw-bold" style="font-size: 0.8rem">Imagen</label>
                    <!-- Utilizamos type="file" según buenas prácticas, aunque el backend no exista -->
                    <input type="file" id="prod-imagen" class="form-control rounded-0" accept="image/png, image/jpeg" required />
                  </div>
                </div>
                <div class="mt-4 text-end border-top pt-3">
                  <button type="button" class="btn btn-outline-secondary rounded-0 fw-bold me-2 px-4">CANCELAR</button>
                  <button type="submit" class="btn btn-dark rounded-0 fw-bold px-4">GUARDAR DATOS</button>
                </div>
              </form>
            </div>
          </div>

          <!-- TABLA DE LISTADO DE PRODUCTOS -->
          <h5 class="fw-bold text-uppercase mb-3 text-muted">
            <i class="bi bi-list-task me-2"></i>
            Productos Registrados
          </h5>
          <div class="table-responsive bg-white shadow-sm border-0 mb-5">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-dark">
                <tr class="text-uppercase" style="font-size: 0.85rem">
                  <th scope="col">ID</th>
                  <th scope="col">FOTOGRAFÍA</th>
                  <th scope="col">NOMBRE</th>
                  <th scope="col">PRECIO</th>
                  <th scope="col">DESCUENTO</th>
                  <th scope="col" class="text-center">ACCIONES</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="fw-bold text-muted">001</td>
                  <td><img src="../img/Chaqueta_1.jpeg" alt="Chaqueta" style="width: 45px; height: 45px; object-fit: cover" class="border" /></td>
                  <td class="fw-bold">Chaqueta Oficial F1</td>
                  <td>$120.000</td>
                  <td><span class="badge bg-secondary">0%</span></td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-outline-dark rounded-0 me-1" title="Editar"><i class="bi bi-pencil-fill"></i></button>
                    <button class="btn btn-sm btn-outline-danger rounded-0" title="Eliminar"><i class="bi bi-trash-fill"></i></button>
                  </td>
                </tr>
                <tr>
                  <td class="fw-bold text-muted">002</td>
                  <td><img src="../img/Gorra1.jpeg" alt="Gorra" style="width: 45px; height: 45px; object-fit: cover" class="border" /></td>
                  <td class="fw-bold">Gorra Negra Audi F1</td>
                  <td>$35.000</td>
                  <td><span class="badge bg-danger">15%</span></td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-outline-dark rounded-0 me-1" title="Editar"><i class="bi bi-pencil-fill"></i></button>
                    <button class="btn btn-sm btn-outline-danger rounded-0" title="Eliminar"><i class="bi bi-trash-fill"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin_validaciones.js"></script>
  </body>
</html>
