<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Usuario - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="d-flex vh-100">
      <!-- Menú Lateral -->
      <aside
        class="sidebar bg-light border-end d-flex flex-column p-3"
        style="width: 250px"
      >
        <a
          href="home.html"
          class="fs-4 fw-bold text-dark text-decoration-none mb-3"
          >MI TIENDA</a
        >
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="home.html" class="nav-link text-dark">Dashboard</a>
          </li>
          <li>
            <a href="productos_listar.html" class="nav-link text-dark"
              >Productos</a
            >
          </li>
          <li>
            <a href="usuarios_listar.html" class="nav-link active bg-dark"
              >Usuarios</a
            >
          </li>
        </ul>
      </aside>

      <main class="content p-4 w-100 bg-white overflow-auto">
        <h1 class="h2 fw-bold border-bottom pb-2 mb-4">NUEVO USUARIO</h1>

        <div class="card p-4 shadow-sm border-0" style="max-width: 900px">
          <form id="form-usuario">
            <div class="row">
              <!-- RUN -->
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold"
                  >RUN (Sin puntos ni guion)</label
                >
                <input
                  type="text"
                  class="form-control rounded-0"
                  id="runUsuario"
                  placeholder="19011022K"
                />
                <div id="errorRun" class="text-danger small mt-1 d-none"></div>
              </div>
              <!-- Nombre -->
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">NOMBRES</label>
                <input
                  type="text"
                  class="form-control rounded-0"
                  id="nomUsuario"
                />
                <div id="errorNom" class="text-danger small mt-1 d-none"></div>
              </div>
              <!-- Apellidos -->
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">APELLIDOS</label>
                <input
                  type="text"
                  class="form-control rounded-0"
                  id="apeUsuario"
                />
                <div id="errorApe" class="text-danger small mt-1 d-none"></div>
              </div>
            </div>

            <div class="row">
              <!-- Correo -->
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">CORREO</label>
                <input
                  type="email"
                  class="form-control rounded-0"
                  id="emailUsuario"
                />
                <div
                  id="errorEmail"
                  class="text-danger small mt-1 d-none"
                ></div>
              </div>
              <!-- Fecha Nacimiento -->
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold"
                  >FECHA NACIMIENTO (Opcional)</label
                >
                <input
                  type="date"
                  class="form-control rounded-0"
                  id="fechaUsuario"
                />
              </div>
              <!-- Tipo de Usuario (Rol) -->
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">TIPO DE USUARIO</label>
                <select class="form-select rounded-0" id="tipoUsuario">
                  <option value="">Seleccione...</option>
                  <option value="Administrador">Administrador</option>
                  <option value="Vendedor">Vendedor</option>
                  <option value="Cliente">Cliente</option>
                </select>
                <div id="errorTipo" class="text-danger small mt-1 d-none"></div>
              </div>
            </div>

            <div class="row">
              <!-- Región y Comuna -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">REGIÓN</label>
                <select class="form-select rounded-0" id="regionUsuario">
                  <option value="">-- Seleccione --</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">COMUNA</label>
                <select
                  class="form-select rounded-0"
                  id="comunaUsuario"
                  disabled
                >
                  <option value="">-- Seleccione región --</option>
                </select>
              </div>
            </div>

            <!-- Dirección -->
            <div class="mb-3">
              <label class="form-label fw-bold">DIRECCIÓN</label>
              <input
                type="text"
                class="form-control rounded-0"
                id="dirUsuario"
              />
              <div id="errorDir" class="text-danger small mt-1 d-none"></div>
            </div>

            <button type="submit" class="btn btn-dark w-100 mt-3 rounded-0">
              GUARDAR USUARIO
            </button>
          </form>
        </div>
      </main>
    </div>

    <script src="../js/admin_usuarios.js"></script>
  </body>
</html>
